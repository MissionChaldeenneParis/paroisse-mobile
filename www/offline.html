<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Hors connexion — Mission Chaldéenne</title>
    <style>
      :root {
        --bordeaux: #801624;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #ffffff;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        min-height: 100vh;
      }
      .badge {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: var(--bordeaux);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
        box-shadow: 0 10px 30px rgba(128, 22, 36, 0.25);
      }
      .badge svg {
        width: 52px;
        height: 52px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
        color: var(--bordeaux);
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        max-width: 320px;
        margin: 0 0 28px;
        color: #444;
      }
      button {
        appearance: none;
        border: none;
        background: var(--bordeaux);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 28px;
        border-radius: 999px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="badge" aria-hidden="true">
      <!-- Icône "nuage barré" -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19a4.5 4.5 0 0 0 .5-8.98A6 6 0 0 0 6.6 8.2" />
        <path d="M8 19h9.5" />
        <line x1="3" y1="3" x2="21" y2="21" />
      </svg>
    </div>
    <h1>Pas de connexion</h1>
    <p>
      Impossible de joindre le site pour le moment. Vérifiez votre connexion
      Internet, puis réessayez.
    </p>
    <button onclick="location.reload()">Réessayer</button>
  </body>
</html>
